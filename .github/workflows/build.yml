name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: CrunchBoost-apk
          path: app/build/outputs/apk/debug/*.apk

      # A "latest" release gives a direct .apk link that's easy to open on a phone.
      - name: Publish to the "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk CrunchBoost.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest CrunchBoost.apk \
            --title "CrunchBoost (latest build)" \
            --notes "Built from commit ${GITHUB_SHA::7}. Download CrunchBoost.apk below and open it to install." \
            --target "$GITHUB_SHA"
